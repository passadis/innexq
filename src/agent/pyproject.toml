[project]
name = "innexq-hosted-agent"
version = "0.1.0"
description = "InnexQ's single read-only Foundry Hosted Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-framework-foundry==1.12.0",
  "agent-framework-foundry-hosting==1.0.0b260903",
  "azure-ai-agentserver-responses==2.2.0b1",
  "azure-ai-agentserver-invocations==1.2.0b1",
  "azure-identity>=1.24,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-cov>=6,<7", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=contracts --cov=retrieval --cov=main --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
