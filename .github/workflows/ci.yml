name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci --prefix src/web --ignore-scripts
      - run: npm run verify --prefix src/web
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Formatting
        run: uv run python scripts/tasks.py format-check
      - name: Linting
        run: uv run python scripts/tasks.py lint
      - name: Type checking
        run: uv run python scripts/tasks.py type-check
      - name: Contract schema synchronization
        run: uv run python scripts/tasks.py schema-check
      - name: Unit tests
        run: uv run python scripts/tasks.py test-unit
      - name: Locked Hosted Agent safety tests
        run: uv run python scripts/tasks.py test-agent
      - name: Secret scanning
        run: uv run python scripts/tasks.py security-check

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - name: Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Terraform initialization without backend
        working-directory: infra
        run: terraform init -backend=false -input=false
      - name: Terraform validation without Azure credentials
        working-directory: infra
        run: terraform validate
